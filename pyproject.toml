[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metermaid-cli"
dynamic = ["version"]
description = "Background usage tracker for Claude Code and Codex CLI sessions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "rich>=14.3.3",
]
authors = [
    { name = "Tom" },
]
keywords = ["claude", "codex", "cli", "usage", "metrics", "tokens"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]

[project.scripts]
metermaid = "metermaid.cli:main"

[project.urls]
Homepage = "https://github.com/Mathews-Tom/codetrack"
Repository = "https://github.com/Mathews-Tom/codetrack"
Issues = "https://github.com/Mathews-Tom/codetrack/issues"

[tool.hatch.version]
path = "src/metermaid/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/metermaid"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.11"
